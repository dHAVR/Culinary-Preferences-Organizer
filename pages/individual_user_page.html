<!-- User Page-->

<!DOCTYPE html>


<html>


   <head>
      <!--Charset-->
      <meta charset="UTF-8">
      <!--Title-->
      <title>User Profile</title>
   </head>


   <body>

      <header>
      </header>


      <main>

         <h1>User Profile</h1>
         <p>Type of Account: [Type of Account]</p>

         <section class="profile">

            <div class="left">
               <img src="#" alt="User Photo">
               <button>Change the profile picture</button>
            </div>

            <div class="center">
               <input type="text" placeholder="Nationality"><br>
               <input type="number" placeholder="Age"><br>
               <input type="text" placeholder="Username"><br>
               <input type="password" placeholder="Password"><br>
               <button>Update Profile</button>
               <button>Delete Account</button>
               <button>Logout</button>
            </div>

            <div class="right">

               <section>
                  <h2>Allergies</h2>
                  <input type="text" placeholder="Allergy 1"><br>
                  <input type="text" placeholder="Allergy 2"><br>
                  <input type="text" placeholder="Allergy 3"><br>
                  <input type="text" placeholder="Allergy 4"><br>
               </section>

               <section>
                  <h2>Culinary Preferences</h2>
                  <input type="text" placeholder="Preference 1"><br>
                  <input type="text" placeholder="Preference 2"><br>
                  <input type="text" placeholder="Preference 3"><br>
                  <input type="text" placeholder="Preference 4"><br>
               </section>

            </div>

         </section>

      </main>
      

      <footer>
      </footer>

   </body>


</html>
