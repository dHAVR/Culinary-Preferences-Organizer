<!-- Statistics -->

<!DOCTYPE html>



<html>

    <head>

        <!-- Charset -->
        <meta charset = "UTF-8" />

        <!-- Viewport -->
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />

        <!-- Favicon -->
        <link rel = "icon" type = "image/x-icon" href = "../images/favicon.ico" />

        <!-- Stylesheet -->
        <link rel = "stylesheet" href = "../styles/feature_statistics.css">
        
        <!-- Title -->
        <title>Statistics</title>

    </head>


    <body>

        <!-- Header -->
        <header class = "header">
            
            <!-- Logo -->
            <a href = "./authentication_home_page.html">
                <img class = "logo" src = "../images/logo.png" alt = "Logo." />
            </a>

            <!-- Title -->
            <a class = "title_link" href = "./authentication_home_page.html">
                <h1 class = "title">Culinary Preferences Organizer</h1>
            </a>

            <!-- User Profile Picture -->
            <a href = "./user_profile_individual.html">
                <img class = "user_profile_picture" src = "../images/anonymous_user_profile_picture.png" alt = "User profile picture." />
            </a>

        </header>


        <!-- Main Window -->
        <main class = "main">

            <!-- Title -->
            <div class = "title_container">
                <h1 class = "title">Statistics</h1>
            </div>
            
            <div class = "statistics">

                <div class = "left_content">

                    <!-- Statistics Types -->
                    <section class = "statistics_types">
                        <button class = "button">Personal Statistics</button>
                        <button class = "button">Global Statistics</button>
                    </section>
    
                    <!-- Export Options -->
                    <section class = "export_options">
                        <button class = "button">Export to PDF</button>
                        <button class = "button">Export to CSV</button>
                    </section>
    
                </div>
    
                <div class = "right_content">
    
                    <!-- Statistics Visualization -->
                    <section>
                        <p>Statistics</p>
                    </section>
    
                </div>

            </div>

        </main>


        <!-- Footer -->
        <footer class = "footer">

            <!-- Copyright -->
            <p class = "copyright">
                Copyright &copy; 2024 Culinary Preferences Organizer
            </p>

        </footer>

    </body>

</html>
