<!-- Administrator User Profile -->

<!DOCTYPE html>



<html>

   <head>

      <!--Charset-->
      <meta charset="UTF-8">

      <!--Title-->
      <title>My Profile</title>

      <link rel = "stylesheet" href = "../styles/admin_user_page_style.css" />

   </head>


   <body>

      <header class = "header">
            
         <!-- Logo -->
         <a href = "./authentication_home_page.html">
             <img class = "logo" src = "../images/logo.png" alt = "Logo." />
         </a>

         <!-- Title -->
         <a class = "title_link" href = "./authentication_home_page.html">
             <h1 class = "title">Culinary Love for You</h1>
         </a>

         <!-- User Profile Picture -->
         <a href = "./user_profile_individual.html">
             <img class = "user_profile_picture" src = "../images/anonymous_user_profile_picture.png" alt = "User profile picture." />
         </a>

     </header>

      <main>


         <h2 class = "page_title">User Profile</h2>

        <section class = "left">

         <h4>Account Type: Administrator</h4>

         <section class="grid-container">

         <form action="#" method="post">
            <section>
               <label for="username">Username:</label>
               <input type="text" id="username" name="username">
            </section>
            
            <section>
               <label for="password">Password:</label>
               <input type="password" id="password" name="password">
            </section>
         
        </form>

        <input type="submit" value="Update Credits">

         </section>

        <button class = "action_button">Delete Account</button>
        <button class = "action_button">Logout</button>

        </section>
       
        <section class="right">
             <!--Information to which the admin should have access (for example, a list of users)-->
            <h2>Database Information</h2>
           <p id = "title_list_of_users">List of users:</p>
           <ul>
            <li>Anna</li>
            <li>Kostya</li>
            <li>Petro</li>
         </ul>
        </section>


      </main>

      <footer class = "footer">

         <!-- Copyright -->
         <p class = "copyright">
             Copyright &copy; 2024 Culinary Preferences Organizer
         </p>

     </footer>

   </body>

</html>
