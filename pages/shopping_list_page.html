<!--Shopping list page-->

<!DOCTYPE html>


<html>


   <head>

      <!--Charset-->
      <meta charset="UTF-8">
      <!--Title-->
      <title>Shopping List</title>

   </head>


   <body>
    
      <header>
      </header>

      <main>

         <h1>Shopping List</h1>

         <section class="left">
            <input type="text" placeholder="Enter list name">
            <button>Create a list</button>
            <input type="text" placeholder="Enter item">
            <button>Add item</button>
         </section>

         <section class="center">
            <!-- Shopping list items will be added here -->
            <p>[Name of the list]</p>
            <ul>
               <li>List item 1</li>
               <li>List item 2</li>
               <li>List item 3</li>
            </ul>
         </section>

         <section class="right">
            <button>Export to PDF</button>
            <p>List of groups:</p>
            <select>
               <option value="group1">Group 1</option>
               <option value="group2">Group 2</option>
               <option value="group3">Group 3</option>
            </select>
            <button>Share</button>
         </section>

      </main>

      <footer>
      </footer>

   </body>


</html>
