
<!DOCTYPE html>


<html>
   
   <head>

      <!--Charset-->
      <meta charset="UTF-8">
      <!--Title-->
      <title>My Profile</title>

      <link rel = "stylesheet" href = "../styles/profile_individual_style.css" />
      
   </head>


   <body>

      <header>
      </header>


      <main>

         <h1 class = "title">User Profile</h1>

            <section class="left">

               <h4>Type of Account: [Type of Account]</h4>
               <img src="#" alt="User Photo">
               <p>Name: [Name of the user]</p>
               <p>Username: [Username of the user]</p>
               <p>Nationality: [Nationality of the user]</p>
               <p>Age: [Age of the user]</p>

               <button class="left_button">Change the profile picture</button>
               <button class="left_button">Delete Account</button>
               <button class="left_button">Logout</button>

            </section>

            <section class="center">

               <h3>Additional information about you:</h3>
               <section class="grid-container">
                  
                 <form action = "#" method = "POST">

                     <section>
                       <input type="text" placeholder="Nationality">
                       <input type="text" placeholder="Age">
                       <input type="text" placeholder="Username">
                       <input type="password" placeholder="Password">
                     </section>
                   <input type = "submit" value = "Update Profile" />
                   
                  </form>

               </section>

            </section>

            <section class="right">
               <section class="grid-container">
         
                  <h2 >Allergies</h2>
                  <form action = "#" method = "POST">
                     <section>
                       <input type="text" placeholder="Allergy 1">
                       <input type="text" placeholder="Allergy 2">
                     </section>

                     <section>
                         <input type="text" placeholder="Allergy 3">
                         <input type="text" placeholder="Allergy 4">
                      </section>

                      <input type = "submit" value = "Add Allergies" />

                  </form>
                  
               </section>

               <section class="grid-container">

                  <h2>Culinary Preferences</h2>

                 <form action = "#" method = "POST">
               
                     <section>
                        <input type="text" placeholder="Preference 1">
                         <input type="text" placeholder="Preference 2">
                      </section>
 
                     <section>
                        <input type="text" placeholder="Preference 3">
                         <input type="text" placeholder="Preference 4">
                      </section> 

                    <input type = "submit" value = "Add preferences" />

                  </form>

               </section>
            
            </section>
      </main>

      <footer>
      </footer>

   </body>


</html>
