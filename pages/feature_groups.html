<!-- Groups -->

<!DOCTYPE html>



<html>

    <head>

        <!-- Charset -->
        <meta charset = "UTF-8" />

        <!-- Viewport -->
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />

        <!-- Favicon -->
        <link rel = "icon" type = "image/x-icon" href = "../images/favicon.ico" />

        <!-- Stylesheet -->
        <link rel = "stylesheet" href = "../styles/feature_groups.css">
        
        <!-- Title -->
        <title>Groups</title>

    </head>


    <body>

        <!-- Header -->
        <header class = "header">
            
            <!-- Logo -->
            <a href = "./authentication_home_page.html">
                <img class = "logo" src = "../images/logo.png" alt = "Logo." />
            </a>

            <!-- Title -->
            <a class = "title_link" href = "./authentication_home_page.html">
                <h1 class = "title">Culinary Preferences Organizer</h1>
            </a>

            <!-- User Profile Picture -->
            <a href = "./user_profile_individual.html">
                <img class = "user_profile_picture" src = "../images/anonymous_user_profile_picture.png" alt = "User profile picture." />
            </a>

        </header>


        <!-- Main Window -->
        <main class = "main">

            <!-- Title -->
            <div class = "page_title_container">
                <h1 class = "page_title">Groups</h1>
            </div>
            

            <!-- My Groups -->
            <div class = "groups_container">

                <section class = "my_groups_container">

                    <h2>My Groups</h2>
    
                    <ul>
                        <li>Family</li>
                        <li>Friends</li>
                        <li>Trip</li>
                    </ul>
                
                </section>
    
                <!-- Selected Group -->
                <section class = "selected_group_container">
    
                    <h2>Family</h2>
    
                    <ul>
                        <li>James Smith</li>
                        <li>Linda Smith</li>
                        <li>Roger Smith</li>
                    </ul>
    
                </section>
    
                <!-- New Group -->
                <section class = "new_group_container">
    
                    <div class = "new_group_title_container">
                        <h2>New Group</h2>
                    </div>
    
                    <div class = "create_group_container">

                        <!-- Create Group -->
                        <form class = "create_group_form" action = "#" method = "GET">
        
                            <div>
                                <label for = "group_name">Name:</label>
                                <input type = "text" id = "group_name" name = "group_name" placeholder = "Friends" />
                            </div>
        
                            <div>
                                <input type = "submit" value = "Create" />
                            </div>
        
                        </form>

                    </div>
    
                    <div class = "add_person_container">

                        <!-- Add Person -->
                        <form class = "add_person_form" action = "#" method = "GET">
        
                            <div>
                                <label for = "email_address">Email Address:</label>
                                <input type = "text" id = "email_address" name = "email_address" placeholder = "linda_smith@gmail.com" />
                            </div>

                            <div>
                                <label for = "add_person">Add Person:</label>
                                <input type = "submit" id = "add_person" name = "add_person" value = "Add" />
                            </div>

                        </form>

                    </div>
    
                </section>

            </div>

        </main>


        <!-- Footer -->
        <footer class = "footer">

            <!-- Copyright -->
            <p class = "copyright">
                Copyright &copy; 2024 Culinary Preferences Organizer
            </p>

        </footer>

    </body>

</html>
