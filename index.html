<!-- Home Page for Anonymous Users -->

<!DOCTYPE html>



<html>

    <head>

        <!-- Charset -->
        <meta charset = "UTF-8" />

        <!-- Viewport -->
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />

        <!-- Favicon -->
        <link rel = "icon" type = "image/x-icon" href = "./images/favicon.ico" />

        <!-- Stylesheet -->
        <link rel = "stylesheet" href = "./styles/index.css">
        
        <!-- Title -->

    <body>
