<!-- Groups -->

<!DOCTYPE html>



<html>

    <head>

        <!-- Charset -->
        <meta charset = "UTF-8" />
        
        <!-- Title -->
        <title>Groups</title>

    </head>


    <body>

        <!-- Header -->
        <header>
            
            <!-- Logo -->
            <img src = "#" alt = "Logo." />

            <!-- Website Name -->
            <h1>Culinary Preferences Organizer</h1>

            <!-- User Picture -->
            <img src = "#" alt = "User picture." />

        </header>


        <!-- Main Window -->
        <main>

            <!-- Title -->
            <h1>Groups</h1>

            <!-- My Groups -->
            <section>

                <h2>My Groups</h2>

                <ul>
                    <li>Family</li>
                    <li>Friends</li>
                    <li>Trip</li>
                </ul>
            
            </section>

            <!-- Selected Group -->
            <section>

                <h2>Family</h2>

                <ul>
                    <li>James Smith</li>
                    <li>Linda Smith</li>
                    <li>Roger Smith</li>
                </ul>

            </section>

            <!-- New Group -->
            <section>

                <h2>New Group</h2>

                <!-- Create Group -->
                <form action = "#" method = "GET">

                    <label for = "group_name">Name:</label>
                    <input type = "text" id = "group_name" name = "group_name" placeholder = "Friends" />

                    <input type = "submit" value = "Create" />

                </form>

                <!-- Add Person -->
                <form action = "#" method = "GET">

                    <label for = "email_address">Email Address:</label>
                    <input type = "text" id = "email_address" name = "email_address" placeholder = "linda_smith@gmail.com" />

                    <label for = "add_person">Add Person:</label>
                    <input type = "submit" id = "add_person" name = "add_person" value = "Add" />

                </form>

            </section>

        </main>


        <!-- Footer -->
        <footer>

            <!-- Copyright -->
            <p>
                Copyright &copy; 2024 Culinary Preferences Organizer
            </p>

            <!-- System Requirements Specification -->
            <a href = "./pages/software_requirements_specification.html">
                System Requirements Specification
            </a>

        </footer>

    </body>

</html>
