<!-- Registration -->

<!DOCTYPE html>



<html>

    <head>

        <!-- Charset -->
        <meta charset = "UTF-8" />
        
        <!-- Title -->
        <title>Registration</title>

    </head>


    <body>

        <!-- Header -->
        <header>
            
            <!-- Logo -->
            <img src = "#" alt = "Logo." />

            <!-- Website Name -->
            <h1>Culinary Preferences Organizer</h1>

            <!-- User Picture -->
            <img src = "#" alt = "User picture." />

        </header>


        <!-- Main Window -->
        <main>

            <!-- Title -->
            <h1>Register</h1>

            <!-- Registration Form -->
            <form action = "#" method = "GET">

                <!-- First Name -->
                <label for = "first_name">First Name:</label>
                <input type = "text" id = "first_name" name = "first_name" placeholder = "James" />

                <!-- Last Name -->
                <label for = "last_name">Last Name:</label>
                <input type = "text" id = "last_name" name = "last_name" placeholder = "Smith" />

                <!-- Username -->
                <label for = "username">Username:</label>
                <input type = "text" id = "username" name = "username" placeholder = "james_smith" />

                <!-- Account Type -->
                <label for = "account_type">Account Type:</label>
                <select id = "account_type" name = "account_type">
                    <option value = "individual_account_type">Individual</option>
                    <option value = "administrator_account_type">Administrator</option>
                </select>

                <!-- Password -->
                <label for = "password">Password:</label>
                <input type = "password" id = "password" name = "password" placeholder = "*********" />

                <!-- Register -->
                <input type = "submit" value = "Register" />

            </form>

        </main>


        <!-- Footer -->
        <footer>

            <!-- Copyright -->
            <p>
                Copyright &copy; 2024 Culinary Preferences Organizer
            </p>

            <!-- System Requirements Specification -->
            <a href = "./pages/software_requirements_specification.html">
                System Requirements Specification
            </a>

        </footer>

    </body>

</html>
