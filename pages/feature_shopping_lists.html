<!-- Shopping Lists -->

<!DOCTYPE html>



<html>


   <head>

      <!--Charset-->
      <meta charset="UTF-8">
      
      <!--Title-->
      <title>Shopping Lists</title>

      
      <link rel = "stylesheet" href = "../styles/shopping_list_style.css" />

   </head>


   <body>
    
      <header>
      </header>

      <main>

         <h1 class = "title">Shopping List</h1>

         <section class="left">
           <h2>List creation</h2>
             <!-- Create List -->
             <form action = "#" method = "POST">
               <label for = "list_name">Name:</label>
               <input type = "text" id = "list_name" name = "list_name" />
               <input type = "submit" value = "Create a list" />
           </form>

             <!-- Create List -->
             <form action = "#" method = "POST">
               <label for = "new_item">Add item:</label>
               <input type = "text" id = "new_item" name = "new_item" />
               <input type = "submit" value = "Add item" />
           </form>

         </section>

         <section class="center">
            <!-- Shopping list items will be added here -->
            <p>[Name of the list]</p>
            <ul>
               <li>List item 1</li>
               <li>List item 2</li>
               <li>List item 3</li>
            </ul>
         </section>

         <section class="right">
            <button>Export to PDF</button>
            <p>List of groups:</p>
            <select>
               <option value="group1">Group 1</option>
               <option value="group2">Group 2</option>
               <option value="group3">Group 3</option>
            </select>
            <button>Share</button>
         </section>

      </main>

      <footer>
      </footer>

   </body>


</html>
